name: Build SchlagiOS ISO

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
      options: --privileged
    steps:
      - name: Projektdateien holen
        uses: actions/checkout@v4

      - name: CachyOS-Schluessel und Repo hinzufuegen
        run: |
          pacman-key --init
          pacman-key --recv-keys F3B607488DB35A47 --keyserver keyserver.ubuntu.com
          pacman-key --lsign-key F3B607488DB35A47
          sed -i '/^\[core\]$/i[cachyos]\nServer = https://mirror.cachyos.org/repo/$arch/$repo\n' /etc/pacman.conf

      - name: Abhaengigkeiten installieren
        run: pacman -Syu --noconfirm sudo git archiso cachyos-keyring mkinitcpio-archiso squashfs-tools grub paru

      - name: Profil entpacken und Build-Benutzer anlegen
        run: |
          tar xzf schlagios-iso-profile-*.tar.gz
          useradd builder -m
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chmod -R a+rwX .

      - name: AUR-Pakete bauen (Caelestia, Claude Code, Branding)
        working-directory: schlagios-iso
        run: |
          sudo -H -E -u builder bash -c './aur-repo/build-aur-repo.sh 2>&1 | tee ../aur.log; exit ${PIPESTATUS[0]}'

      - name: ISO bauen
        working-directory: schlagios-iso
        run: |
          sudo -H -E -u builder bash -c './buildiso.sh -v 2>&1 | tee ../build.log; exit ${PIPESTATUS[0]}'

      - name: ISO hochladen
        uses: actions/upload-artifact@v4
        with:
          name: schlagios-iso
          path: schlagios-iso/out/schlagios/*

      - name: Logs hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            aur.log
            build.log  
